<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In — MVN.WEB</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="auth.css" />
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="logo">MVN<span>.WEB</span></a>
    <div class="nav-links">
      <a href="register.html" class="btn btn-outline">Create Account</a>
    </div>
  </nav>

  <main class="auth-wrapper">
    <div class="auth-card">
      <h2>Welcome Back</h2>
      <p class="auth-subtitle">Sign in to access your MVN.WEB tech network.</p>

      <div id="authError" class="error-msg"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="loginEmail">Email Address</label>
          <input type="email" id="loginEmail" placeholder="you@domain.com" required />
        </div>

        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" placeholder="••••••••" required />
        </div>

        <button type="submit" class="btn btn-primary auth-btn">Sign In</button>
      </form>

      <p class="auth-switch">
        New to MVN.WEB? <a href="register.html">Register your profile</a>
      </p>
    </div>
  </main>

  <script src="https://jsdelivr.net"></script>
  <script src="config.js"></script>
  <script src="supsbase.js"></script>
  <script src="auth.js"></script>
</body>
</html>
