<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — MVN.WEB</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="auth.css" />
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="logo">MVN<span>.WEB</span></a>
    <div class="nav-links">
      <a href="login.html" class="btn btn-outline">Log In</a>
    </div>
  </nav>

  <main class="auth-wrapper">
    <div class="auth-card">
      <h2>Join MVN.WEB</h2>
      <p class="auth-subtitle">Build your tech identity and showcase your skills.</p>

      <div id="authError" class="error-msg"></div>

      <form id="registerForm">
        <div class="form-group">
          <label for="regName">Full Name</label>
          <input type="text" id="regName" placeholder="e.g. Brian Ochieng" required />
        </div>

        <div class="form-group">
          <label for="regEmail">Email Address</label>
          <input type="email" id="regEmail" placeholder="you@domain.com" required />
        </div>

        <div class="form-group">
          <label for="regRole">Tech Role / Headline</label>
          <input type="text" id="regRole" placeholder="e.g. Backend Engineer | DevOps" required />
        </div>

        <div class="form-group">
          <label for="regSkills">Core Skills (comma-separated)</label>
          <input type="text" id="regSkills" placeholder="Python, React, Docker, AWS" required />
        </div>

        <div class="form-group">
          <label for="regPassword">Password</label>
          <input type="password" id="regPassword" placeholder="Minimum 6 characters" minlength="6" required />
        </div>

        <button type="submit" class="btn btn-primary auth-btn">Create Tech Profile</button>
      </form>

      <p class="auth-switch">
        Already have an account? <a href="login.html">Log in</a>
      </p>
    </div>
  </main>

  <script src="https://jsdelivr.net"></script>
  <script src="config.js"></script>
  <script src="supsbase.js"></script>
  <script src="auth.js"></script>
</body>
</html>
